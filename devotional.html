  <meta name="theme-color" content="#fff9eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1410" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply saved reading settings before first paint (no flash of wrong theme).
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('cjt-settings') || '{}');
        var d = document.documentElement;
        if (s.theme === 'dark' || s.theme === 'light') d.dataset.theme = s.theme;
        if (s.size) d.style.setProperty('--read-size', s.size + 'px');
        if (s.notes === false) d.classList.add('notes-off');
      } catch (e) {}
    })();
  </script>
</head>
