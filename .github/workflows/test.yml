name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run project tests
        run: |
          node tests/devotional-email.test.js
          node tests/devotional.test.js
          node tests/language.test.js
          node tests/legal.test.js
          node tests/nav.test.js
          node tests/phone.test.js
          node tests/security.test.js
          node tests/sync-merge.test.js
