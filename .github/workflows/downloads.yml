name: Rebuild downloads

on:
  push:
    branches: [main]
    paths:
      # Bible text only. data/devotionals.json is not part of the download build.
      - 'data/books/**'
      - 'data/books.json'
      - 'data/front-matter.json'
      - 'tools/build-downloads.js'
      - 'downloads/SCHEMA.md'
      - '.github/workflows/downloads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install free tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          curl -fsSL -o /tmp/typst.tar.xz https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo cp /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          curl -fsSL -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q /tmp/epubcheck.zip -d /tmp
      - name: Build PDF, EPUB, JSON, text, and USFM
        run: node tools/build-downloads.js
        env:
          EPUBCHECK: /tmp/epubcheck-5.2.1/epubcheck.jar
      - name: Commit rebuilt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads
          if git diff --cached --quiet; then
            echo "Downloads already match the text."
          else
            git commit -m "Rebuild Clay Jar Translation downloads"
            git push
          fi
